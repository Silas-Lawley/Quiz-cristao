<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Cristão</title>
<style>
  :root {
    --bg: #f4efe6;
    --card: #ffffff;
    --ink: #2c2a26;
    --muted: #6b675f;
    --gold: #a9812e;
    --gold-dark: #8a6a22;
    --green: #2f7d4f;
    --red: #b3413a;
    --border: #e6ddca;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(180deg, #f8f4ec 0%, #f0e9d8 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 12px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .header {
    text-align: center;
    margin-bottom: 18px;
  }
  .header h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
    color: var(--gold-dark);
    letter-spacing: 0.5px;
  }
  .header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 4px 18px rgba(80, 60, 20, 0.08);
    margin-bottom: 16px;
  }
  .stats-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat {
    flex: 1;
    text-align: center;
    background: #faf6ec;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px;
  }
  .stat .num { font-size: 1.3rem; font-weight: bold; color: var(--gold-dark); display: block; }
  .stat .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .progress-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .dot.done { background: var(--green); }
  .dot.active { background: var(--gold); }
  .category-tag {
    display: inline-block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
    color: #fff;
  }
  .category-tag.geral { background: #6a8caf; }
  .category-tag.evangelho { background: var(--gold); }
  .category-tag.personagens { background: #7a6a9c; }
  .category-tag.ministerio { background: #4f8a6d; }
  .category-tag.sangue { background: #a1453d; }
  .category-tag.panorama { background: #b07a3a; }
  .question-text {
    font-size: 1.15rem;
    line-height: 1.5;
    margin: 0 0 18px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    text-align: left;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-family: inherit;
    font-size: 0.98rem;
    cursor: pointer;
    transition: all 0.15s ease;
    color: var(--ink);
  }
  .option:hover:not(:disabled) { border-color: var(--gold); background: #fdf9ef; }
  .option:disabled { cursor: default; }
  .option.correct { background: #eaf5ee; border-color: var(--green); color: var(--green); font-weight: bold; }
  .option.wrong { background: #fbeceb; border-color: var(--red); color: var(--red); font-weight: bold; }
  .feedback {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    background: #faf6ec;
    border-left: 4px solid var(--gold);
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .feedback .ref { font-weight: bold; color: var(--gold-dark); }
  .next-btn, .primary-btn {
    margin-top: 18px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--gold-dark);
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .next-btn:hover, .primary-btn:hover { background: #6f5419; }
  .done-screen { text-align: center; }
  .done-screen .verse {
    font-style: italic;
    color: var(--muted);
    margin: 14px 0 6px;
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .done-screen .verse-ref { font-weight: bold; color: var(--gold-dark); font-style: normal; display:block; margin-top: 4px; }
  .score-big { font-size: 2.4rem; color: var(--gold-dark); font-weight: bold; margin: 6px 0; }
  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>✝ Quiz Cristão</h1>
    <p>"Lâmpada para os meus pés é a tua palavra" — Salmo 119:105</p>
  </div>

  <div class="card">
    <div class="stats-row">
      <div class="stat"><span class="num" id="streakNum">0</span><span class="label">Sequência</span></div>
      <div class="stat"><span class="num" id="totalNum">0</span><span class="label">Acertos totais</span></div>
      <div class="stat"><span class="num" id="playedNum">0</span><span class="label">Dias jogados</span></div>
    </div>
  </div>

  <div class="card" id="quizCard"></div>

  <p class="footer-note">3 perguntas novas a cada dia · Toda pergunta traz a referência bíblica para você conferir.</p>
</div>

<script>
// ---------- Banco de perguntas ----------
// cat: geral | evangelho | personagens | ministerio | sangue | panorama
const BANK = [{"cat":"geral","q":"Quem construiu a arca para escapar do dilúvio?","opts":["Abraão","Noé","Moisés","Jó"],"correct":1,"ref":"Gênesis 6–9","exp":"Noé foi instruído por Deus a construir a arca para salvar sua família e os animais."},{"cat":"geral","q":"Quantos dias e noites choveu durante o dilúvio?","opts":["7 dias","10 dias","40 dias","100 dias"],"correct":2,"ref":"Gênesis 7:12","exp":"A chuva caiu sobre a terra durante 40 dias e 40 noites."},{"cat":"geral","q":"Qual é o primeiro livro da Bíblia?","opts":["Êxodo","Gênesis","Levítico","Salmos"],"correct":1,"ref":"Gênesis 1:1","exp":"Gênesis narra a criação e as origens do povo de Deus."},{"cat":"geral","q":"Quem foi vendido como escravo pelos próprios irmãos?","opts":["Benjamim","Rúben","José","Judá"],"correct":2,"ref":"Gênesis 37","exp":"José foi vendido por seus irmãos, mas Deus usou isso para o bem, anos depois."},{"cat":"geral","q":"Quem liderou o povo de Israel para fora do Egito?","opts":["Josué","Arão","Moisés","Calebe"],"correct":2,"ref":"Livro de Êxodo","exp":"Moisés foi usado por Deus para libertar Israel da escravidão no Egito."},{"cat":"geral","q":"Quantos mandamentos Deus deu a Moisés no Monte Sinai?","opts":["7","10","12","5"],"correct":1,"ref":"Êxodo 20","exp":"Os Dez Mandamentos foram dados como fundamento da lei moral de Israel."},{"cat":"geral","q":"Quem derrubou os muros de Jericó com o som de trombetas?","opts":["Josué","Gideão","Sansão","Davi"],"correct":0,"ref":"Josué 6","exp":"Após marcharem ao redor da cidade por 7 dias, os muros caíram pela fé e obediência."},{"cat":"geral","q":"Quem matou o gigante Golias com uma funda e uma pedra?","opts":["Saul","Jônatas","Davi","Salomão"],"correct":2,"ref":"1 Samuel 17","exp":"Davi, um jovem pastor, venceu o gigante confiando no Senhor dos exércitos."},{"cat":"geral","q":"Quem foi o rei mais sábio de Israel, autor de grande parte de Provérbios?","opts":["Davi","Salomão","Roboão","Ezequias"],"correct":1,"ref":"1 Reis 3–4","exp":"Salomão pediu sabedoria a Deus e recebeu também riquezas e honra."},{"cat":"geral","q":"Em que cidade Jesus nasceu?","opts":["Nazaré","Jerusalém","Belém","Cafarnaum"],"correct":2,"ref":"Mateus 2:1 / Lucas 2:4-7","exp":"Cumprindo a profecia de Miqueias 5:2, Jesus nasceu em Belém."},{"cat":"geral","q":"Quem batizou Jesus no rio Jordão?","opts":["Pedro","João Batista","Filipe","André"],"correct":1,"ref":"Mateus 3:13-17","exp":"João Batista preparava o caminho do Senhor e batizou Jesus, ouvindo a voz do Pai dos céus."},{"cat":"geral","q":"Quantos discípulos (apóstolos) Jesus escolheu?","opts":["7","10","12","70"],"correct":2,"ref":"Mateus 10:1-4","exp":"Jesus escolheu doze apóstolos para segui-lo de perto e depois pregar o evangelho."},{"cat":"geral","q":"Qual foi o primeiro milagre de Jesus, segundo o evangelho de João?","opts":["Curar um cego","Multiplicar pães","Transformar água em vinho","Acalmar a tempestade"],"correct":2,"ref":"João 2:1-11","exp":"Nas bodas de Caná, Jesus transformou água em vinho, manifestando sua glória."},{"cat":"geral","q":"Quem traiu Jesus por trinta moedas de prata?","opts":["Tomé","Judas Iscariotes","Mateus","Filipe"],"correct":1,"ref":"Mateus 26:14-16","exp":"Judas entregou Jesus aos principais sacerdotes por esse valor."},{"cat":"geral","q":"Quem negou conhecer Jesus três vezes antes do galo cantar?","opts":["João","Tiago","Pedro","André"],"correct":2,"ref":"Mateus 26:69-75","exp":"Pedro negou Jesus por medo, mas depois foi restaurado e se tornou líder da igreja."},{"cat":"geral","q":"Em qual monte Jesus foi crucificado?","opts":["Monte Sinai","Monte das Oliveiras","Gólgota (Calvário)","Monte Tabor"],"correct":2,"ref":"João 19:17-18","exp":"Gólgota significa 'lugar da caveira', onde Jesus foi crucificado fora da cidade."},{"cat":"geral","q":"Após quantos dias Jesus ressuscitou?","opts":["1 dia","3 dias","7 dias","40 dias"],"correct":1,"ref":"1 Coríntios 15:4","exp":"Cristo ressuscitou ao terceiro dia, conforme as Escrituras."},{"cat":"geral","q":"Quem perseguia os cristãos e depois se converteu, tornando-se apóstolo?","opts":["Barnabé","Paulo (Saulo de Tarso)","Timóteo","Silas"],"correct":1,"ref":"Atos 9:1-22","exp":"Saulo foi transformado no caminho de Damasco e passou a pregar o evangelho que antes perseguia."},{"cat":"geral","q":"Qual é o último livro da Bíblia?","opts":["Judas","Apocalipse","2 Pedro","3 João"],"correct":1,"ref":"Livro de Apocalipse","exp":"Apocalipse revela o triunfo final de Cristo e a nova criação."},{"cat":"geral","q":"Quem escreveu a maior parte das epístolas do Novo Testamento?","opts":["Pedro","João","Paulo","Tiago"],"correct":2,"ref":"Cartas paulinas","exp":"Paulo escreveu treze cartas, incluindo Romanos, Coríntios, Gálatas e Efésios."},{"cat":"geral","q":"Qual profeta foi engolido por um grande peixe?","opts":["Isaías","Jonas","Ezequiel","Amós"],"correct":1,"ref":"Jonas 1–2","exp":"Jonas fugiu do chamado de Deus, mas foi resgatado e pregou em Nínive."},{"cat":"geral","q":"Quem interpretou os sonhos do Faraó no Egito?","opts":["Moisés","Arão","José","Davi"],"correct":2,"ref":"Gênesis 41","exp":"José interpretou os sonhos sobre os sete anos de fartura e sete de fome."},{"cat":"geral","q":"Quem foi lançado na cova dos leões por continuar orando a Deus?","opts":["Daniel","Ezequiel","Sadraque","Elias"],"correct":0,"ref":"Daniel 6","exp":"Daniel permaneceu fiel em oração mesmo sob ameaça de morte, e Deus o livrou."},{"cat":"geral","q":"Quantos livros tem o Novo Testamento?","opts":["24","27","39","66"],"correct":1,"ref":"Cânon do Novo Testamento","exp":"O Novo Testamento reúne 27 livros, dos Evangelhos ao Apocalipse."},{"cat":"geral","q":"Quem foi o irmão que matou Abel?","opts":["Sete","Caim","Enos","Cam"],"correct":1,"ref":"Gênesis 4","exp":"Caim matou seu irmão Abel por inveja, sendo o primeiro homicídio da Bíblia."},{"cat":"geral","q":"Em qual monte Abraão ia sacrificar seu filho Isaque?","opts":["Monte Sinai","Monte Moriá","Monte Carmelo","Monte Ararat"],"correct":1,"ref":"Gênesis 22:2","exp":"Deus proveu um cordeiro no lugar de Isaque, prefigurando o sacrifício de Cristo."},{"cat":"geral","q":"Qual apóstolo era conhecido como 'o discípulo amado'?","opts":["Pedro","Tiago","João","André"],"correct":2,"ref":"João 13:23; 21:20","exp":"João se refere a si mesmo dessa forma em seu evangelho."},{"cat":"geral","q":"Quantos anos os israelitas vagaram no deserto antes de entrar na terra prometida?","opts":["10 anos","20 anos","40 anos","100 anos"],"correct":2,"ref":"Números 14:33-34","exp":"Por causa da desobediência, uma geração vagou 40 anos no deserto."},{"cat":"geral","q":"Quem foi a primeira mulher, criada por Deus a partir da costela de Adão?","opts":["Sara","Eva","Rebeca","Raquel"],"correct":1,"ref":"Gênesis 2:22","exp":"Eva foi formada por Deus para ser auxiliadora e companheira de Adão."},{"cat":"geral","q":"Qual rei teve um sonho com uma grande estátua feita de diferentes metais, interpretado por Daniel?","opts":["Ciro","Nabucodonosor","Dario","Belsazar"],"correct":1,"ref":"Daniel 2","exp":"Daniel interpretou o sonho como representando os reinos que se sucederiam na história."},{"cat":"evangelho","q":"Segundo Efésios 2:8-9, pela graça somos salvos, mediante o quê?","opts":["As obras","A fé","A lei","Os sacrifícios"],"correct":1,"ref":"Efésios 2:8-9","exp":"'Pela graça sois salvos, por meio da fé; e isto não vem de vós, é dom de Deus; não vem das obras, para que ninguém se glorie.'"},{"cat":"evangelho","q":"Segundo Efésios 2:9, a salvação não vem de obras para que ninguém possa fazer o quê?","opts":["Se gloriar","Descansar","Duvidar","Testemunhar"],"correct":0,"ref":"Efésios 2:9","exp":"A salvação é dom de Deus justamente para que nenhum ser humano possa se orgulhar de merecê-la."},{"cat":"evangelho","q":"Quem disse: 'Eu sou o caminho, a verdade e a vida; ninguém vem ao Pai, senão por mim'?","opts":["João Batista","Pedro","Jesus","Paulo"],"correct":2,"ref":"João 14:6","exp":"Jesus afirma ser o único mediador entre Deus e os homens."},{"cat":"evangelho","q":"Segundo João 3:16, por que Deus enviou seu Filho ao mundo?","opts":["Porque amou o mundo","Para julgar o mundo","Para testar a humanidade","Para punir os pecadores"],"correct":0,"ref":"João 3:16","exp":"'Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito...'"},{"cat":"evangelho","q":"Segundo João 3:16, o que acontece a quem crê no Filho de Deus?","opts":["Fica rico","Não sofre mais","Tem vida eterna e não perece","Vira profeta"],"correct":2,"ref":"João 3:16","exp":"'...para que todo aquele que nele crê não pereça, mas tenha a vida eterna.'"},{"cat":"evangelho","q":"Qual é o 'salário do pecado', segundo Romanos 6:23?","opts":["A doença","A morte","A pobreza","A vergonha"],"correct":1,"ref":"Romanos 6:23","exp":"'Porque o salário do pecado é a morte, mas o dom gratuito de Deus é a vida eterna em Cristo Jesus.'"},{"cat":"evangelho","q":"Qual é o 'dom gratuito de Deus', segundo Romanos 6:23?","opts":["A vida eterna em Cristo Jesus","A riqueza material","A sabedoria humana","A boa saúde"],"correct":0,"ref":"Romanos 6:23","exp":"Ao contrário do salário do pecado, a vida eterna é dada gratuitamente em Cristo."},{"cat":"evangelho","q":"Segundo Romanos 3:23, quem pecou e está destituído da glória de Deus?","opts":["Somente os incrédulos","Todos","Somente os líderes religiosos","Ninguém"],"correct":1,"ref":"Romanos 3:23","exp":"'Porque todos pecaram e destituídos estão da glória de Deus.'"},{"cat":"evangelho","q":"Segundo Romanos 10:9, o que devemos fazer para sermos salvos?","opts":["Guardar a lei perfeitamente","Confessar Jesus como Senhor e crer que Deus o ressuscitou","Fazer boas obras suficientes","Nascer em família cristã"],"correct":1,"ref":"Romanos 10:9","exp":"A salvação é pela confissão de fé em Cristo e na sua ressurreição."},{"cat":"evangelho","q":"Segundo João 14:26, qual é o papel do Espírito Santo, o Consolador?","opts":["Substituir Jesus","Ensinar tudo e lembrar as palavras de Jesus","Julgar o mundo imediatamente","Revelar novas escrituras"],"correct":1,"ref":"João 14:26","exp":"O Espírito Santo ensina e faz lembrar tudo o que Jesus disse aos seus discípulos."},{"cat":"evangelho","q":"O que se rasgou ao meio no momento da morte de Jesus, simbolizando acesso direto a Deus?","opts":["O véu do templo","As vestes dos sacerdotes","O céu","O altar"],"correct":0,"ref":"Mateus 27:51","exp":"O véu rasgado simboliza que, por Cristo, todos podem se aproximar de Deus sem mediador humano."},{"cat":"evangelho","q":"Segundo 1 Coríntios 15:3-4, o evangelho é que Cristo morreu, foi sepultado e...?","opts":["Subiu aos céus imediatamente","Ressuscitou ao terceiro dia","Permaneceu no túmulo","Apareceu apenas em sonhos"],"correct":1,"ref":"1 Coríntios 15:3-4","exp":"A ressurreição de Cristo ao terceiro dia é o centro da mensagem do evangelho."},{"cat":"evangelho","q":"Quem disse: 'Não há salvação em nenhum outro, porque não há debaixo do céu nenhum outro nome... pelo qual devamos ser salvos'?","opts":["Pedro","Estêvão","Filipe","Tiago"],"correct":0,"ref":"Atos 4:12","exp":"Pedro pregou diante do Sinédrio que a salvação está somente em Jesus Cristo."},{"cat":"evangelho","q":"Segundo Tito 3:5, Deus nos salvou não por obras de justiça que houvéssemos feito, mas segundo o quê?","opts":["Nossa fé perfeita","Sua misericórdia","Nosso arrependimento merecido","Nossa herança religiosa"],"correct":1,"ref":"Tito 3:5","exp":"A salvação nasce da misericórdia de Deus, não do mérito humano."},{"cat":"evangelho","q":"Segundo Gálatas 5:22-23, qual destes é um fruto do Espírito?","opts":["Orgulho","Amor","Inveja","Rivalidade"],"correct":1,"ref":"Gálatas 5:22-23","exp":"O fruto do Espírito inclui amor, alegria, paz, longanimidade, benignidade, bondade, fidelidade, mansidão e domínio próprio."},{"cat":"evangelho","q":"Segundo 2 Coríntios 5:17, quem está em Cristo é uma nova o quê?","opts":["Lei","Aliança apenas","Criatura","Doutrina"],"correct":2,"ref":"2 Coríntios 5:17","exp":"'Se alguém está em Cristo, nova criatura é: as coisas velhas já passaram; eis que tudo se fez novo.'"},{"cat":"evangelho","q":"O que Jesus disse na cruz sobre os que o crucificavam?","opts":["'Vingai-me, Pai'","'Pai, perdoa-lhes, porque não sabem o que fazem'","Nada, ficou em silêncio","'Eles merecem julgamento'"],"correct":1,"ref":"Lucas 23:34","exp":"Mesmo na cruz, Jesus demonstrou graça e perdão."},{"cat":"evangelho","q":"Segundo Atos 1:8, o que os discípulos receberiam ao vir sobre eles o Espírito Santo?","opts":["Riquezas","Poder para serem testemunhas de Cristo","Autoridade política","Longevidade"],"correct":1,"ref":"Atos 1:8","exp":"O Espírito Santo capacita a igreja para testemunhar de Cristo a todas as nações."},{"cat":"evangelho","q":"Qual mandamento Jesus chamou de 'o maior e o primeiro'?","opts":["Não matar","Amar a Deus sobre todas as coisas","Guardar o sábado","Honrar pai e mãe"],"correct":1,"ref":"Mateus 22:37-38","exp":"Jesus resume a lei no amor a Deus e ao próximo."},{"cat":"evangelho","q":"Qual é o segundo maior mandamento, segundo Jesus?","opts":["Amar o próximo como a si mesmo","Jejuar regularmente","Dar dízimos","Não roubar"],"correct":0,"ref":"Mateus 22:39","exp":"Amar ao próximo como a si mesmo resume a segunda tábua da lei."},{"cat":"evangelho","q":"Segundo Hebreus 9:22, sem derramamento de sangue não há o quê?","opts":["Aliança","Remissão (perdão de pecados)","Templo","Sacerdócio"],"correct":1,"ref":"Hebreus 9:22","exp":"O sacrifício de Cristo cumpriu definitivamente o que os sacrifícios do Antigo Testamento apontavam."},{"cat":"evangelho","q":"Segundo Filipenses 2:7, Jesus, sendo em forma de Deus, se esvaziou a si mesmo tomando a forma de quê?","opts":["Rei","Anjo","Servo","Sacerdote"],"correct":2,"ref":"Filipenses 2:6-7","exp":"Cristo se humilhou, tornando-se servo e obediente até a morte de cruz."},{"cat":"evangelho","q":"O que Jesus prometeu ao ladrão arrependido na cruz?","opts":["'Hoje estarás comigo no paraíso'","'Serás liberto amanhã'","'Tua família será abençoada'","Nada, permaneceu calado"],"correct":0,"ref":"Lucas 23:43","exp":"Jesus concedeu salvação instantânea ao ladrão que confessou fé, mostrando a graça pela fé, sem obras."},{"cat":"evangelho","q":"Segundo Gálatas 2:20, Paulo disse: 'já não sou eu quem vive, mas...'?","opts":["Cristo vive em mim","A lei vive em mim","Meu passado vive em mim","Ninguém vive em mim"],"correct":0,"ref":"Gálatas 2:20","exp":"Paulo descreve a nova identidade do crente, unido a Cristo."},{"cat":"evangelho","q":"Qual é a definição de fé segundo Hebreus 11:1?","opts":["Um sentimento passageiro","A certeza das coisas que se esperam e a convicção de fatos que se não veem","Uma tradição religiosa","Um conjunto de regras"],"correct":1,"ref":"Hebreus 11:1","exp":"A fé bíblica é confiança firme em Deus e em suas promessas, mesmo sem ver."},{"cat":"evangelho","q":"Segundo 1 João 1:9, se confessarmos os nossos pecados, o que Deus faz?","opts":["Ignora","É fiel e justo para nos perdoar e purificar","Espera mais provas","Julga imediatamente"],"correct":1,"ref":"1 João 1:9","exp":"Deus é fiel para perdoar todo aquele que confessa seus pecados com sinceridade."},{"cat":"evangelho","q":"Qual evento a igreja celebra 50 dias após a Páscoa, quando o Espírito Santo desceu sobre os discípulos?","opts":["Transfiguração","Pentecostes","Ascensão","Purificação"],"correct":1,"ref":"Atos 2","exp":"Em Pentecostes, o Espírito Santo foi derramado, dando início à igreja."},{"cat":"evangelho","q":"Segundo Apocalipse 3:20, o que Jesus está fazendo 'à porta'?","opts":["Observando em silêncio","Batendo, esperando que alguém o ouça e abra","Indo embora","Construindo"],"correct":1,"ref":"Apocalipse 3:20","exp":"Jesus convida cada pessoa a abrir o coração e ter comunhão com ele."},{"cat":"evangelho","q":"Qual é a 'grande comissão' dada por Jesus em Mateus 28:19?","opts":["Construir templos","Ir e fazer discípulos de todas as nações, batizando-os","Reunir riquezas para a igreja","Esperar em Jerusalém para sempre"],"correct":1,"ref":"Mateus 28:19-20","exp":"Jesus ordena à igreja levar o evangelho a todas as nações, batizando e ensinando."},{"cat":"evangelho","q":"Segundo Romanos 5:8, como Deus prova o seu amor por nós?","opts":["Cristo morreu por nós, sendo nós ainda pecadores","Nos dando riqueza","Nos protegendo de todo sofrimento","Nos dando uma lei perfeita"],"correct":0,"ref":"Romanos 5:8","exp":"Deus demonstra seu amor ao enviar Cristo para morrer por pecadores, antes mesmo do arrependimento."},{"cat":"personagens","q":"Quem foi o sacerdote e rei de Salém que abençoou Abraão, a quem Abraão deu o dízimo de tudo?","opts":["Jetro","Melquisedeque","Labão","Balaão"],"correct":1,"ref":"Gênesis 14:18-20","exp":"Melquisedeque é uma figura misteriosa, rei-sacerdote, vista como um tipo (prefiguração) de Cristo em Hebreus 7."},{"cat":"personagens","q":"Quem se transformou em estátua de sal ao olhar para trás enquanto fugia de Sodoma?","opts":["A esposa de Ló","Sara","Agar","Tamar"],"correct":0,"ref":"Gênesis 19:26","exp":"Ela desobedeceu à ordem de não olhar para trás durante a destruição de Sodoma e Gomorra."},{"cat":"personagens","q":"Qual general sírio foi curado da lepra ao se banhar sete vezes no rio Jordão, por conselho do profeta Eliseu?","opts":["Naamã","Hazael","Balaque","Nabucodonosor"],"correct":0,"ref":"2 Reis 5","exp":"Naamã inicialmente resistiu, mas obedeceu e foi curado, reconhecendo o Deus de Israel."},{"cat":"personagens","q":"Qual juíza e profetisa liderou Israel e uma vitória contra o general Sísera?","opts":["Rute","Débora","Ester","Miriã"],"correct":1,"ref":"Juízes 4-5","exp":"Débora julgava Israel e, ao lado de Baraque, liderou a vitória sobre as forças de Sísera."},{"cat":"personagens","q":"Quem teve força sobrenatural ligada aos seus cabelos e foi traído por Dalila?","opts":["Sansão","Gideão","Jefté","Otniel"],"correct":0,"ref":"Juízes 16","exp":"Sansão perdeu sua força ao ter os cabelos cortados, mas Deus ainda o usou em sua última vitória."},{"cat":"personagens","q":"Qual profeta foi leva at":"ministerio","q":"Quanto tempo, aproximadamente, durou o ministério público de Jesus na terra?","opts":["1 ano","3 anos","10 anos","33 anos"],"correct":1,"ref":"Cronologia dos Evangelhos","exp":"A tradição, baseada nas festas mencionadas no evangelho de João, situa o ministério público de Jesus em cerca de 3 anos."},{"cat":"ministerio","q":"Onde Jesus foi tentado por Satanás durante 40 dias, logo após seu batismo?","opts":["No templo de Jerusalém","No deserto","No monte das Oliveiras","Na Galileia"],"correct":1,"ref":"Mateus 4:1-11","exp":"Jesus resistiu às três tentações citando as Escrituras."},{"cat":"ministerio","q":"Quais foram os primeiros discípulos que Jesus chamou, à beira do mar da Galileia?","opts":["Cobradores de impostos","Pescadores","Fariseus","Soldados romanos"],"correct":1,"ref":"Mateus 4:18-22","exp":"Pedro, André, Tiago e João deixaram suas redes para segui-lo."},{"cat":"ministerio","q":"Em qual ensino Jesus proclamou as Bem-aventuranças ('Bem-aventurados os pobres de espírito...')?","opts":["Parábola do semeador","Sermão do Monte","Discurso do Monte das Oliveiras","Última ceia"],"correct":1,"ref":"Mateus 5-7","exp":"O Sermão do Monte reúne ensinos centrais de Jesus sobre o Reino de Deus."},{"cat":"ministerio","q":"Quem apareceu ao lado de Jesus na Transfiguração, conversando sobre sua partida?","opts":["Abraão e Davi","Moisés e Elias","João Batista e Isaías","Adão e Noé"],"correct":1,"ref":"Mateus 17:1-3","exp":"A cena confirmou diante de Pedro, Tiago e João que Jesus cumpria a Lei (Moisés) e os Profetas (Elias)."},{"cat":"ministerio","q":"Com quantos pães e peixes Jesus alimentou cerca de 5 mil homens?","opts":["2 pães e 5 peixes","5 pães e 2 peixes","7 pães e 3 peixes","10 pães e 1 peixe"],"correct":1,"ref":"João 6:1-13","exp":"Um menino ofereceu o pouco que tinha, e Jesus multiplicou para alimentar a multidão."},{"cat":"ministerio","q":"Em qual cidade Jesus ressuscitou Lázaro, que já estava morto havia 4 dias?","opts":["Betânia","Belém","Cafarnaum","Jericó"],"correct":0,"ref":"João 11:1-44","exp":"Esse foi um dos maiores sinais de Jesus, mostrando seu poder sobre a morte."},{"cat":"ministerio","q":"Como ficou conhecida a entrada de Jesus em Jerusalém, montado num jumentinho, aclamado pela multidão?","opts":["Ascensão","Transfiguração","Entrada triunfal","Pentecostes"],"correct":2,"ref":"Mateus 21:1-11","exp":"O povo estendeu mantos e ramos no caminho, cumprindo a profecia de Zacarias 9:9."},{"cat":"ministerio","q":"O que Jesus instituiu na última ceia com os discípulos, na noite em que foi traído?","opts":["A Ceia do Senhor (pão e vinho)","O batismo","O jejum de 40 dias","A festa dos tabernáculos"],"correct":0,"ref":"Mateus 26:26-28","exp":"Jesus deu novo significado ao pão e ao vinho, apontando para seu corpo e sangue entregues por nós."},{"cat":"ministerio","q":"Quantos dias Jesus permaneceu na terra após a ressurreição, antes de subir aos céus?","opts":["3 dias","7 dias","40 dias","50 dias"],"correct":2,"ref":"Atos 1:3","exp":"Durante esse período, Jesus apareceu a diversos discípulos, provando estar vivo."},{"cat":"sangue","q":"Segundo Levítico 17:11, o que há no sangue que faz expiação pela alma?","opts":["A vida da carne","A força do animal","O perfume do sacrifício","A cor vermelha"],"correct":0,"ref":"Levítico 17:11","exp":"O Antigo Testamento já ensinava que a vida está no sangue, base para o sistema sacrificial que apontava para Cristo."},{"cat":"sangue","q":"Segundo Hebreus 9:22, sem derramamento de sangue não há o quê?","opts":["Aliança","Remissão (perdão) de pecados","Templo","Sacerdócio"],"correct":1,"ref":"Hebreus 9:22","exp":"O sacrifício de Cristo cumpriu definitivamente o que os sacrifícios antigos apenas prefiguravam."},{"cat":"sangue","q":"Segundo 1 Pedro 1:18-19, fomos resgatados não com coisas corruptíveis, mas com o precioso sangue de quem?","opts":["Cristo, como cordeiro sem defeito","Um profeta","Um anjo","Um sacerdote levita"],"correct":0,"ref":"1 Pedro 1:18-19","exp":"O resgate não veio de prata ou ouro, mas do sangue precioso de Cristo."},{"cat":"sangue","q":"Segundo Efésios 1:7, em Cristo temos a redenção por meio do seu sangue, ou seja, o quê?","opts":["Riquezas materiais","O perdão dos pecados","Longevidade","Proteção física garantida"],"correct":1,"ref":"Efésios 1:7","exp":"A redenção e o perdão dos pecados vêm segundo as riquezas da graça de Deus."},{"cat":"sangue","q":"Segundo Apocalipse 1:5, o que Jesus fez por nós, por seu amor, com o seu próprio sangue?","opts":["Nos livrou (lavou) dos nossos pecados","Nos deu poder político","Nos tornou invisíveis ao mal","Nos afastou da igreja"],"correct":0,"ref":"Apocalipse 1:5","exp":"Jesus é descrito como aquele que nos ama e nos libertou dos pecados por meio de seu sangue."},{"cat":"sangue","q":"Segundo Apocalipse 12:11, os irmãos venceram o acusador por causa do sangue do Cordeiro e por causa de quê mais?","opts":["Da palavra do testemunho deles","De suas riquezas","De sua genealogia","De seus jejuns"],"correct":0,"ref":"Apocalipse 12:11","exp":"A vitória sobre o acusador combina a obra de Cristo com o testemunho fiel dos crentes."},{"cat":"sangue","q":"Segundo Romanos 5:9, sendo já justificados pelo sangue de Cristo, seremos salvos por meio dele de quê?","opts":["Da ira (de Deus)","Da pobreza","Das perseguições","Da velhice"],"correct":0,"ref":"Romanos 5:9","exp":"A justificação presente garante a salvação futura da ira vindoura."},{"cat":"sangue","q":"Segundo Colossenses 1:20, Deus reconciliou consigo todas as coisas, tendo feito a paz por meio do sangue de quê?","opts":["Da cruz de Cristo","Dos profetas","Dos sacerdotes do templo","Dos mártires"],"correct":0,"ref":"Colossenses 1:20","exp":"A cruz é o centro da reconciliação entre Deus e toda a criação."},{"cat":"sangue","q":"Segundo 1 João 1:7, o sangue de Jesus, o Filho de Deus, faz o quê por quem anda na luz?","opts":["Nos purifica de todo pecado","Nos torna ricos","Nos protege de doenças","Nos dá poder profético"],"correct":0,"ref":"1 João 1:7","exp":"A purificação contínua pelo sangue de Cristo acompanha a comunhão na luz."},{"cat":"sangue","q":"Segundo Mateus 26:28, o que Jesus disse que seu sangue representava, a ser derramado por muitos?","opts":["O sangue da (nova) aliança, para remissão dos pecados","Um símbolo de tristeza","Um sinal de fraqueza","Uma promessa de riqueza"],"correct":0,"ref":"Mateus 26:28","exp":"Na última ceia, Jesus liga seu sangue diretamente ao perdão dos pecados e à nova aliança."},{"cat":"panorama","q":"Quantos livros tem a Bíblia ao todo, somando Antigo e Novo Testamento?","opts":["39","66","73","27"],"correct":1,"ref":"Cânon bíblico protestante","exp":"São 39 livros no Antigo Testamento e 27 no Novo Testamento, totalizando 66."},{"cat":"panorama","q":"Quantos livros tem o Antigo Testamento?","opts":["27","39","46","24"],"correct":1,"ref":"Cânon do Antigo Testamento","exp":"O Antigo Testamento reúne 39 livros, do Gênesis a Malaquias."},{"cat":"panorama","q":"Como se chama o grupo dos 5 primeiros livros da Bíblia, tradicionalmente atribuídos a Moisés?","opts":["Pentateuco","Históricos","Poéticos","Sinóticos"],"correct":0,"ref":"Gênesis a Deuteronômio","exp":"Pentateuco significa 'cinco rolos/livros': Gênesis, Êxodo, Levítico, Números e Deuteronômio."},{"cat":"panorama","q":"Quantos livros históricos há no Antigo Testamento (de Josué a Ester)?","opts":["5","12","17","9"],"correct":1,"ref":"Josué a Ester","exp":"São 12 livros históricos, narrando a entrada em Canaã até o retorno do exílio."},{"cat":"panorama","q":"Quais destes é um dos 5 livros poéticos do Antigo Testamento?","opts":["Salmos","Josué","Daniel","Mateus"],"correct":0,"ref":"Jó, Salmos, Provérbios, Eclesiastes e Cantares","exp":"Os livros poéticos exploram sabedoria, louvor e reflexão sobre a vida diante de Deus."},{"cat":"panorama","q":"Quantos 'profetas maiores' existem no Antigo Testamento?","opts":["3","5","12","7"],"correct":1,"ref":"Isaías, Jeremias, Lamentações, Ezequiel e Daniel","exp":"São chamados 'maiores' pela extensão de seus escritos, não por maior importância."},{"cat":"panorama","q":"Quantos 'profetas menores' existem no Antigo Testamento?","opts":["12","5","20","8"],"correct":0,"ref":"Oséias a Malaquias","exp":"São 12 livros proféticos mais curtos, de Oséias a Malaquias."},{"cat":"panorama","q":"Em quais idiomas a Bíblia foi originalmente escrita?","opts":["Latim, grego e inglês","Hebraico, aramaico e grego","Apenas hebraico","Português antigo e grego"],"correct":1,"ref":"Composição original das Escrituras","exp":"O Antigo Testamento foi escrito majoritariamente em hebraico (partes em aramaico), e o Novo Testamento em grego."},{"cat":"panorama","q":"Quantos evangelhos há no Novo Testamento?","opts":["3","4","5","2"],"correct":1,"ref":"Mateus, Marcos, Lucas e João","exp":"Os quatro evangelhos narram a vida, morte e ressurreição de Jesus sob perspectivas complementares."},{"cat":"panorama","q":"Aproximadamente em quantos anos a Bíblia foi escrita, e por cerca de quantos autores diferentes?","opts":["100 anos, 5 autores","1.600 anos, cerca de 40 autores","500 anos, 2 autores","50 anos, 100 autores"],"correct":1,"ref":"História da composição bíblica","exp":"Reis, profetas, pastores, médicos e pescadores escreveram ao longo de séculos uma mensagem unificada."}];

const CATEGORY_LABELS = {
  geral: 'Conhecimento Bíblico',
  evangelho: 'Mensagem do Evangelho',
  personagens: 'Personagens Bíblicos',
  ministerio: 'Ministério de Jesus',
  sangue: 'O Poder do Sangue de Jesus',
  panorama: 'Panorama Bíblico',
};

// ---------- Rotação diária ----------
const PER_DAY = 3;
const totalBlocks = Math.floor(BANK.length / PER_DAY);

function dayIndexSince(date) {
  const epoch = new Date(2026, 0, 1); // 1 jan 2026 como referência
  const diff = Math.floor((date - epoch) / 86400000);
  return ((diff % totalBlocks) + totalBlocks) % totalBlocks;
}

function todayKey(d) {
  return d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
}

const today = new Date();
const key = todayKey(today);
const block = dayIndexSince(today);
const questions = BANK.slice(block * PER_DAY, block * PER_DAY + PER_DAY);

// ---------- Estado / localStorage ----------
const STORE_KEY = 'quizCristao_v1';
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveStore(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

let store = loadStore();
if (!store.totalCorrect) store.totalCorrect = 0;
if (!store.daysPlayed) store.daysPlayed = [];
if (!store.streak) store.streak = 0;
if (!store.lastPlayedKey) store.lastPlayedKey = null;

let current = 0;
let correctCountToday = 0;
let answeredToday = store.daysPlayed.includes(key);

function updateStatsUI() {
  document.getElementById('streakNum').textContent = store.streak;
  document.getElementById('totalNum').textContent = store.totalCorrect;
  document.getElementById('playedNum').textContent = store.daysPlayed.length;
}

function renderDots() {
  let html = '<div class="progress-dots">';
  for (let i = 0; i < questions.length; i++) {
    let cls = 'dot';
    if (i < current) cls += ' done';
    else if (i === current) cls += ' active';
    html += `<div class="${cls}"></div>`;
  }
  html += '</div>';
  return html;
}

function renderQuestion() {
  const card = document.getElementById('quizCard');
  if (answeredToday) {
    renderAlreadyDone();
    return;
  }
  if (current >= questions.length) {
    finishToday();
    return;
  }
  const item = questions[current];
  const catLabel = CATEGORY_LABELS[item.cat] || item.cat;
  let optsHtml = '';
  item.opts.forEach((opt, i) => {
    optsHtml += `<button class="option" data-i="${i}">${opt}</button>`;
  });
  card.innerHTML = `
    ${renderDots()}
    <span class="category-tag ${item.cat}">${catLabel}</span>
    <p class="question-text">${item.q}</p>
    <div class="options">${optsHtml}</div>
    <div id="feedbackArea"></div>
  `;
  const buttons = card.querySelectorAll('.option');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.i), buttons, item));
  });
}

function handleAnswer(choice, buttons, item) {
  buttons.forEach(b => b.disabled = true);
  const isCorrect = choice === item.correct;
  buttons[item.correct].classList.add('correct');
  if (!isCorrect) buttons[choice].classList.add('wrong');
  if (isCorrect) { correctCountToday++; store.totalCorrect++; saveStore(store); updateStatsUI(); }

  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = `
    <div class="feedback">
      ${isCorrect ? '✅ Correto!' : '❌ Não foi dessa vez.'}
      <br><span class="ref">${item.ref}</span><br>${item.exp}
    </div>
    <button class="next-btn" id="nextBtn">${current + 1 < questions.length ? 'Próxima pergunta' : 'Ver resultado do dia'}</button>
  `;
  document.getElementById('nextBtn').addEventListener('click', () => {
    current++;
    renderQuestion();
  });
}

function finishToday() {
  if (!store.daysPlayed.includes(key)) {
    store.daysPlayed.push(key);
    // streak: check if yesterday was played
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    const yKey = todayKey(yesterday);
    if (store.lastPlayedKey === yKey || store.streak === 0) {
      store.streak = store.lastPlayedKey === yKey ? store.streak + 1 : 1;
    } else {
      store.streak = 1;
    }
    store.lastPlayedKey = key;
    saveStore(store);
  }
  updateStatsUI();
  answeredToday = true;
  renderAlreadyDone(true);
}

function renderAlreadyDone(justFinished) {
  const card = document.getElementById('quizCard');
  const scoreLine = justFinished
    ? `Você acertou <strong>${correctCountToday}</strong> de ${questions.length} hoje.`
    : `Volte amanhã para 3 novas perguntas!`;
  card.innerHTML = `
    <div class="done-screen">
      <p style="color:var(--muted); margin-bottom:4px;">Quiz de hoje concluído</p>
      <div class="score-big">${justFinished ? correctCountToday + '/' + questions.length : '✓'}</div>
      <p>${scoreLine}</p>
      <p class="verse">"Bem-aventurados os que não viram e creram."<span class="verse-ref">João 20:29</span></p>
    </div>
  `;
}

updateStatsUI();
renderQuestion();
</script>
